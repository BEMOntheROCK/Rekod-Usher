<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistik - Rekod Usher</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/style.css">

  <!-- Library untuk graf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
  <!-- Library untuk eksport PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <!-- Library untuk eksport XLSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

  <header class="church-header">
    <h1 class="church-title">
      <span class="church-bem">BEM</span>
      <span class="church-ontherock">On The ROCK</span>
    </h1>
    <p class="page-subtitle">Statistik - Ibadah Raya</p>
  </header>

  <main class="admin-container">

    <section class="admin-nav-bar">
      <a href="record.html" class="back-btn">&larr; Kembali</a>
    </section>

    <section class="filter-bar">
      <div class="filter-group">
        <label for="statistikJenis">Papar Mengikut</label>
        <select id="statistikJenis">
          <option value="total">Jumlah Keseluruhan</option>
          <option value="jemaat">Jemaat</option>
          <option value="jumlahUsher">Jumlah Usher</option>
          <option value="rockEssence">Rock Essence</option>
        </select>
      </div>
    </section>

    <section class="export-bar">
      <button id="exportPdfBtn">Eksport PDF</button>
      <button id="exportXlsxBtn">Eksport XLSX</button>
    </section>

    <section class="table-wrapper">
      <div class="chart-container">
        <canvas id="statistikChart"></canvas>
      </div>
      <p id="statistikStatusMessage" class="status-message"></p>
    </section>

  </main>

  <script type="module" src="js/statistik.js"></script>
</body>
</html>
