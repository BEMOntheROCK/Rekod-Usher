<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekod Usher - BEM On The ROCK</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="church-header">
    <h1 class="church-title">
      <span class="church-bem">BEM</span>
      <span class="church-ontherock">On The ROCK</span>
    </h1>
    <p class="page-subtitle">Rekod Usher</p>
  </header>

  <main class="page-container">
    <form id="rekodForm">

      <div class="form-container diisi-oleh-card">
        <div class="form-group">
          <label for="diisiOleh">Diisi Oleh</label>
          <input type="text" id="diisiOleh" name="diisiOleh" required>
        </div>
      </div>

      <div class="form-container">

      <div class="form-group">
        <label for="tarikh">Tarikh</label>
        <input type="date" id="tarikh" name="tarikh" required>
      </div>

      <div class="form-group">
        <label for="acara">Acara</label>
        <input type="text" id="acara" name="acara" value="Ibadah Raya" required>
      </div>

      <div class="form-group">
        <label>Sesi</label>
        <div class="checkbox-row">
          <label class="checkbox-label">
            <input type="radio" id="sesi1" name="sesi" value="sesi1">
            Sesi 1
          </label>
          <label class="checkbox-label">
            <input type="radio" id="sesi2" name="sesi" value="sesi2">
            Sesi 2
          </label>
        </div>
        <p class="field-hint">Jika tidak berkaitan, tidak perlu pilih sesi</p>
      </div>

      <div class="form-group">
        <label for="jumlahUsher">Jumlah Usher</label>
        <input type="number" id="jumlahUsher" name="jumlahUsher" min="0" required>
      </div>

      <div class="form-group">
        <label for="jemaat">Jumlah Jemaat Hadir</label>
        <input type="number" id="jemaat" name="jemaat" min="0" required>
      </div>

      <div class="form-group">
        <label for="rockEssence">Rock Essence</label>
        <input type="number" id="rockEssence" name="rockEssence" min="0" required>
      </div>

      <div class="form-group">
        <label for="total">Jumlah Keseluruhan</label>
        <input type="number" id="total" name="total" readonly>
      </div>

      <button type="submit" id="submitBtn">Hantar</button>

      <p id="statusMessage" class="status-message"></p>

      </div>
    </form>
  </main>

  <footer class="footer-actions">
    <a href="record.html" class="footer-btn">Rekod</a>
    <button type="button" id="qrBtn" class="footer-btn">QR</button>
  </footer>

  <div id="qrModal" class="modal hidden">
    <div class="modal-content qr-modal-content">
      <img src="assets/qr.png" alt="QR Kod" class="qr-image">
      <button type="button" id="closeQrBtn">Tutup</button>
    </div>
  </div>

  <script type="module" src="js/index.js"></script>
</body>
</html>
